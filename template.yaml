AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Recipes API — AWS SAM template (Micronaut).
  Defines the Lambda function and API Gateway routes for local testing and AWS deployment.
  Local testing: sam local start-api (requires Docker).
  Build first with: mvn clean package -DskipTests (Maven 'local' profile must NOT be active).

# Globals apply to all Functions in this template unless overridden per resource.
Globals:
  Function:
    # Must match the Java version in pom.xml (<maven.compiler.release>17</maven.compiler.release>).
    Runtime: java17

    # Micronaut cold starts are significantly faster than Spring Boot (~5-10s vs ~60s)
    # because DI metadata is generated at compile time (no runtime classpath scanning).
    # 512 MB is sufficient; increase only if OOM errors appear under load.
    MemorySize: 512

    # Lower than the Spring Boot equivalent — Micronaut initialises much faster.
    # Still generous enough to accommodate Docker startup on the first SAM local request.
    Timeout: 30

    Environment:
      Variables:
        # Resolved at deploy time to the actual DynamoDB table name.
        RECIPES_TABLE_NAME: !Ref RecipesTable
        # Empty in production — overridden in env.json for local testing against DynamoDB Local.
        DYNAMODB_ENDPOINT: ""

Resources:
  RecipesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # SAM's built-in Java Maven workflow only supports single-module projects.
      # The Makefile runs 'mvn clean package -DskipTests' from the project root
      # (building all three modules) then copies the fat JAR to ARTIFACTS_DIR.
      BuildMethod: makefile
    Properties:
      # Micronaut's built-in API Gateway proxy handler. Initialises the Micronaut
      # application context and routes each API Gateway proxy event to the
      # appropriate Micronaut controller. No custom handler class required.
      Handler: io.micronaut.function.aws.proxy.payload1.ApiGatewayProxyRequestEventFunction

      # Project root — SAM copies the full multi-module tree to the build temp
      # directory so Maven can resolve all sibling modules when building.
      CodeUri: ./
      Policies:
        # Grants the Lambda execution role read/write access to the Recipes DynamoDB table.
        - DynamoDBCrudPolicy:
            TableName: !Ref RecipesTable

      # API Gateway event sources — one entry per endpoint.
      Events:
        ListRecipes:
          Type: Api
          Properties:
            Path: /recipes
            Method: GET

        CreateRecipe:
          Type: Api
          Properties:
            Path: /recipes
            Method: POST

        GetRecipeById:
          Type: Api
          Properties:
            Path: /recipes/{id}
            Method: GET

  RecipesTable:
    Type: AWS::DynamoDB::Table
    # Retain ensures the table and its data survive a stack deletion (important in production).
    DeletionPolicy: Retain
    Properties:
      TableName: Recipes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  RecipesFunctionApi:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  RecipesTableName:
    Description: DynamoDB table name
    Value: !Ref RecipesTable
